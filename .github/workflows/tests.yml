name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and runtime dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Compile script
        run: python -m compileall -q sync_photos_library.py

